name: tests

# CI for every push and PR to main: a fast `checks` job (lint + type-check +
# build + unit tests) from the repo root, plus the Playwright E2E suite. The two
# jobs run in parallel. GitHub notifies the commit author by email on failure.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Type-check and build (tsc --noEmit && vite build)
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      # The Playwright webServer runs Vite from the repo root, so the root
      # dependencies must be installed as well as the tests' own.
      - name: Install app dependencies
        run: npm ci
        working-directory: .

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browser (chromium engine)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (desktop + mobile)
        run: npx playwright test

      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
